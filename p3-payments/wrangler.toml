# wrangler.toml — P3 Telegram Stars 支付账本 Worker（Modules 格式）
# 与 P2 统一积分账本【共用同一个 D1 库 teleprompter-credits】，
# 这样"支付记录 + 积分发放"可在同一库内做一次原子 batch。
# 部署：wrangler deploy

name = "teleprompter-payments"
main = "payments-worker.js"
compatibility_date = "2024-09-23"

# 复用 P2 的统一积分总账库（同一 database_id）
[[d1_databases]]
binding = "DB"
database_name = "teleprompter-credits"
database_id = "__D1_DATABASE_ID__"   # 与 p2-credits/wrangler.toml 填同一个 id（wrangler d1 create teleprompter-credits 拿到）

# 明文变量（非敏感）。BOT_TOKEN / ADMIN_SECRET / WEBHOOK_SECRET 必须走 secret。
[vars]

# 部署 secret（交互式输入，不落盘）：
#   wrangler secret put BOT_TOKEN        # 与 BotFather token 一致（initData 验签 + 调 Bot API 开发票/设 webhook）
#   wrangler secret put ADMIN_SECRET     # /payments/verify 运营对账门禁
#   wrangler secret put WEBHOOK_SECRET   # setWebhook 的 secret_token（webhook 验签）
#
# 初始化数据库（同一库，本地 + 远程各跑一次；schema 与 P2 累加，不会冲突）：
#   wrangler d1 execute teleprompter-credits --local  --file=./p3-payments/schema.sql
#   wrangler d1 execute teleprompter-credits --remote --file=./p3-payments/schema.sql
#
# 把 Bot 的 webhook 指向本 Worker，并带上 secret_token：
#   curl -F "url=https://teleprompter-payments.<sub>.workers.dev/payments/webhook" \
#        -F "secret_token=$WEBHOOK_SECRET" \
#        https://api.telegram.org/bot<BOT_TOKEN>/setWebhook
