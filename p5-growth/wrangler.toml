# wrangler.toml — P5 病毒增长 Worker（Modules 格式）
# 与 P2 统一积分账本【共用同一个 D1 库 teleprompter-credits】，
# 这样"增长关系 + 积分发放/消耗"可在同一库内保持一致性。
# 部署：wrangler deploy

name = "teleprompter-growth"
main = "growth-worker.js"
compatibility_date = "2024-09-23"

# 复用 P2 的统一积分总账库（同一 database_id）
[[d1_databases]]
binding = "DB"
database_name = "teleprompter-credits"
database_id = "__D1_DATABASE_ID__"   # 与 p2-credits/wrangler.toml 填同一个 id（wrangler d1 create teleprompter-credits 拿到）

# 明文变量（非敏感）。BOT_USERNAME 用于分享深链，明文即可（但可改放 secret）。
[vars]
BOT_USERNAME = "__BOT_USERNAME_PLACEHOLDER__"   # 与 BotFather 用户名一致（用于 t.me/<bot>?start=CODE 深链）
# APP_URL = "https://your-pages.pages.dev"      # 可选：分享卡片跳转用的 Mini App 地址

# 部署 secret（交互式输入，不落盘）：
#   wrangler secret put BOT_TOKEN        # 与 BotFather token 一致（initData 验签）
#   wrangler secret put ADMIN_SECRET     # /growth/verify 运营对账门禁
#
# 初始化数据库（同一库，本地 + 远程各跑一次；schema 与 P2/P3 累加，不会冲突）：
#   wrangler d1 execute teleprompter-credits --local  --file=./p5-growth/schema.sql
#   wrangler d1 execute teleprompter-credits --remote --file=./p5-growth/schema.sql
