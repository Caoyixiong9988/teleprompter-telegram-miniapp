# wrangler.toml — P2 统一积分账本 Worker（Modules 格式）
# 这是三款出海小程序（提词器 / 决策助手 / 表情包）共用的共享后端。
# 部署：wrangler deploy

name = "teleprompter-credits"
main = "credits-worker.js"
compatibility_date = "2024-09-23"

# D1 数据库绑定（统一积分总账）
[[d1_databases]]
binding = "DB"
database_name = "teleprompter-credits"
database_id = "__D1_DATABASE_ID__"   # 用 `wrangler d1 create teleprompter-credits` 拿到后填入

# 明文变量（非敏感）
[vars]
# BOT_TOKEN 用 secret 更安全，见下方命令
# ADMIN_SECRET 必须走 secret（见下方命令）

# 部署 secret（交互式输入，不落盘）：
#   wrangler secret put BOT_TOKEN
#   wrangler secret put ADMIN_SECRET
#
# 初始化数据库：
#   wrangler d1 create teleprompter-credits
#   wrangler d1 execute teleprompter-credits --local --file=./p2-credits/schema.sql
#   wrangler d1 execute teleprompter-credits --remote --file=./p2-credits/schema.sql
