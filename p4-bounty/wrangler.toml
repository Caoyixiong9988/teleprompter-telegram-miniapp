# wrangler.toml — P4 悬赏改稿 Worker（Modules 格式）
# 与 P2 统一积分账本【共用同一个 D1 库 teleprompter-credits】，
# 这样"悬赏托管 escrow + 积分发放"与统一总账在同一库内保持一致（托管/释放均走 ledger-core）。
# 部署：wrangler deploy

name = "teleprompter-bounty"
main = "bounty-worker.js"
compatibility_date = "2024-09-23"

# 复用 P2 的统一积分总账库（同一 database_id）
[[d1_databases]]
binding = "DB"
database_name = "teleprompter-credits"
database_id = "__D1_DATABASE_ID__"   # 与 p2-credits/wrangler.toml 填同一个 id（wrangler d1 create teleprompter-credits 拿到）

# 明文变量（非敏感）
[vars]
# BOT_TOKEN / ADMIN_SECRET 走 secret（见下方命令）

# 部署 secret（交互式输入，不落盘）：
#   wrangler secret put BOT_TOKEN        # 与 BotFather token 一致（initData 验签）
#   wrangler secret put ADMIN_SECRET     # /bounty/verify 运营对账门禁
#
# 初始化数据库（同一库，本地 + 远程各跑一次；schema 与 P2/P3/P5 累加，不会冲突）：
#   wrangler d1 execute teleprompter-credits --local  --file=./p4-bounty/schema.sql
#   wrangler d1 execute teleprompter-credits --remote --file=./p4-bounty/schema.sql
