<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>提词器 · Teleprompter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --primary:#2f6fed; --primary-press:#2257c4;
    --text:#1f2430; --muted:#79808c; --line:#e3e6ec; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto;
    background:var(--panel); box-shadow:0 0 24px rgba(0,0,0,.04);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header .title{font-size:17px; font-weight:700; letter-spacing:.5px;}
  header .sub{font-size:11px; color:var(--muted);}
  #viewport{
    flex:1; position:relative; overflow:hidden; background:#ffffff;
  }
  #scrollText{
    white-space:pre-wrap; word-break:break-word; padding:28px 22px;
    font-size:44px; line-height:1.55; color:var(--text); text-align:center;
    transform-origin:center center; will-change:transform;
  }
  #controlBar{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-top:1px solid var(--line); background:var(--panel);
  }
  .btn{
    border:none; border-radius:12px; background:#eef1f7; color:var(--text);
    font-size:15px; font-weight:600; padding:10px 12px; cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center; min-width:46px; min-height:46px;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--primary); color:#fff;}
  .btn.primary:active{background:var(--primary-press);}
  .btn.icon{font-size:20px;}
  #speedWrap{flex:1; display:flex; align-items:center; gap:8px;}
  #speedWrap label{font-size:12px; color:var(--muted); white-space:nowrap;}
  #speedBar{flex:1; accent-color:var(--primary);}
  #speedBarLabel{font-size:12px; color:var(--primary); font-weight:700; min-width:64px; text-align:right;}

  /* Sheet (modal bottom panel) */
  .sheet{
    position:fixed; inset:0; background:rgba(20,24,33,.45);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .sheet.hidden{display:none;}
  .sheet-inner{
    background:var(--panel); width:100%; max-width:520px; max-height:86dvh; overflow:auto;
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet-inner h3{margin:0 0 14px; font-size:16px;}
  .field{margin-bottom:16px;}
  .field > label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .field .row{display:flex; align-items:center; gap:10px;}
  .field input[type=range]{flex:1; accent-color:var(--primary);}
  .field input[type=color]{width:48px; height:36px; border:none; background:none; padding:0;}
  .field select{
    flex:1; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff;
  }
  .field textarea{
    width:100%; min-height:150px; border:1px solid var(--line); border-radius:12px;
    padding:12px; font-size:15px; line-height:1.5; resize:vertical; font-family:inherit;
  }
  .field .val{font-size:13px; color:var(--primary); font-weight:700; min-width:60px; text-align:right;}
  .switch{display:flex; align-items:center; justify-content:space-between;}
  .switch input{width:46px; height:26px; appearance:none; background:#cfd5e0; border-radius:20px; position:relative; cursor:pointer; transition:.2s;}
  .switch input:checked{background:var(--primary);}
  .switch input::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked::after{left:23px;}
  .hint{font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions .btn{flex:1;}

  /* Card overlay */
  #cardOverlay .sheet-inner{text-align:center;}
  #cardPreview{width:100%; max-width:300px; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .card-actions{display:flex; gap:10px; margin-top:14px;}
  .card-actions .btn{flex:1;}

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
    background:rgba(31,36,48,.92); color:#fff; padding:10px 16px; border-radius:22px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:80; max-width:80%;
    text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #verifyStatus{font-size:12px; color:var(--muted); margin-top:4px;}
  .footer-note{font-size:11px; color:var(--muted); text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">提词器</div>
      <div class="sub">Teleprompter · 流畅提词，解放双眼</div>
    </div>
    <div class="sub" id="verifyStatus" style="text-align:right;"></div>
  </header>

  <div id="viewport">
    <div id="scrollText"></div>
  </div>

  <div id="controlBar">
    <button class="btn primary icon" id="btnPlay" title="播放/暂停">▶</button>
    <button class="btn icon" id="btnReset" title="重置">↺</button>
    <div id="speedWrap">
      <label>速度</label>
      <input type="range" id="speedBar" min="20" max="400" value="90" />
      <span id="speedBarLabel">90像素/秒</span>
    </div>
    <button class="btn icon" id="btnSettings" title="设置">⚙</button>
    <button class="btn icon" id="btnCard" title="生成卡片">🎴</button>
  </div>

  <!-- Settings sheet -->
  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-inner">
      <h3>设置</h3>

      <div class="field">
        <label>脚本（粘贴或编辑你的讲稿，自动保存到本机）</label>
        <textarea id="setScript" placeholder="在这里粘贴或输入讲稿……&#10;支持多段、换行。"></textarea>
        <div class="hint">内容仅保存在你当前设备浏览器中（localStorage），不上传服务器。</div>
      </div>

      <div class="field">
        <label>字号</label>
        <div class="row">
          <input type="range" id="setFontSize" min="24" max="96" value="44" />
          <span class="val" id="setFontSizeLabel">44px</span>
        </div>
      </div>

      <div class="field">
        <label>文字颜色</label>
        <div class="row">
          <input type="color" id="setColor" value="#1f2430" />
          <span class="hint" style="margin:0;">用于提词显示与成片卡。</span>
        </div>
      </div>

      <div class="field">
        <label>对齐方式</label>
        <select id="setAlign">
          <option value="left">左对齐</option>
          <option value="center" selected>居中</option>
          <option value="right">右对齐</option>
        </select>
      </div>

      <div class="field switch">
        <label style="margin:0;">镜像模式（接物理提词支架时开启）</label>
        <input type="checkbox" id="setMirror" />
      </div>

      <div class="field">
        <label>滚动速度</label>
        <div class="row">
          <input type="range" id="setSpeed" min="20" max="400" value="90" />
          <span class="val" id="setSpeedLabel">90像素/秒</span>
          <button class="btn" id="btnSpeedUnit" style="min-width:auto; padding:8px 12px;">切换单位</button>
        </div>
        <div class="hint">单位：像素/秒（px/s）或 字/分（CPM，按当前字号估算）。</div>
      </div>

      <div class="field">
        <label>推荐码（用于成片卡分享深链，可自定义）</label>
        <input type="text" id="setReferral" placeholder="例如 my2026" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px;" />
        <div class="hint">分享卡片会带上 <code>?startapp=推荐码</code> 深链；在 BotFather 配置好用户名后于下方填写 bot 用户名即可生效。</div>
      </div>

      <div class="field">
        <label>Bot 用户名（用于分享深链，可留空）</label>
        <input type="text" id="setBotUser" placeholder="例如 your_bot" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:15px;" />
        <div class="hint">仅用于生成分享链接；不影响提词功能。留空时显示占位 <code>your_bot</code>。</div>
      </div>

      <div class="sheet-actions">
        <button class="btn primary" id="btnCloseSettings">完成</button>
      </div>
      <div class="footer-note" id="verifyStatus2"></div>
    </div>
  </div>

  <!-- Card overlay -->
  <div class="sheet hidden" id="cardOverlay">
    <div class="sheet-inner">
      <h3>成片卡 / 脚本卡</h3>
      <img id="cardPreview" alt="成片卡预览" />
      <div class="hint">卡片含讲稿片段、应用水印与你的推荐码深链，可保存到相册或分享到聊天。</div>
      <div class="card-actions">
        <button class="btn" id="btnDownloadCard">保存到相册</button>
        <button class="btn primary" id="btnShareCard">分享到聊天</button>
      </div>
      <div class="sheet-actions" style="margin-top:10px;">
        <button class="btn" id="btnCloseCard">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   提词器 Telegram Mini App — P1 核心提词器（零后台 MVP）
   单文件 / 原生 JS / 无框架 / 无 AI 调用
   合规：纯工具类应用，无任何占卜 / 预测 / 算命 表述
   ============================================================ */

// ---- 配置（部署时按需修改） ----
const CONFIG = {
  // Worker 验签地址；留空则跳过 initData 服务端校验（本地/浏览器测试用）
  VERIFY_URL: '',
  // Bot 用户名（用于分享深链）；留空时显示占位 your_bot
  BOT_USERNAME: ''
};

const LS_KEY = 'teleprompter_state_v1';

const defaultState = {
  script: '在这里粘贴你的讲稿……\n\n点击右下角 ⚙ 打开设置，编辑脚本、调整字号与速度。\n\n准备好后点左上角 ▶ 开始滚动提词。',
  fontSize: 44,
  color: '#1f2430',
  align: 'center',
  mirror: false,
  speedPx: 90,
  speedCpm: 220,
  speedUnit: 'px', // 'px' | 'cpm'
  referralCode: '',
  botUser: ''
};

let state = Object.assign({}, defaultState);
let cardDataUrl = '';

/* ---------- DOM refs ---------- */
const viewport = document.getElementById('viewport');
const scrollText = document.getElementById('scrollText');
const btnPlay = document.getElementById('btnPlay');
const btnReset = document.getElementById('btnReset');
const btnSettings = document.getElementById('btnSettings');
const btnCard = document.getElementById('btnCard');
const speedBar = document.getElementById('speedBar');
const speedBarLabel = document.getElementById('speedBarLabel');
const settingsSheet = document.getElementById('settingsSheet');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const setScript = document.getElementById('setScript');
const setFontSize = document.getElementById('setFontSize');
const setFontSizeLabel = document.getElementById('setFontSizeLabel');
const setColor = document.getElementById('setColor');
const setAlign = document.getElementById('setAlign');
const setMirror = document.getElementById('setMirror');
const setSpeed = document.getElementById('setSpeed');
const setSpeedLabel = document.getElementById('setSpeedLabel');
const btnSpeedUnit = document.getElementById('btnSpeedUnit');
const setReferral = document.getElementById('setReferral');
const setBotUser = document.getElementById('setBotUser');
const cardOverlay = document.getElementById('cardOverlay');
const cardPreview = document.getElementById('cardPreview');
const btnDownloadCard = document.getElementById('btnDownloadCard');
const btnShareCard = document.getElementById('btnShareCard');
const btnCloseCard = document.getElementById('btnCloseCard');
const toastEl = document.getElementById('toast');

/* ---------- 持久化 ---------- */
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && typeof s === 'object') state = Object.assign({}, defaultState, s); }
  } catch(e){}
}
let saveTimer = null;
function debounceSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 300);
}

/* ---------- Telegram 集成 ---------- */
function initTelegram(){
  if (window.Telegram && Telegram.WebApp){
    try {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if (Telegram.WebApp.setHeaderColor) Telegram.WebApp.setHeaderColor('#ffffff');
      if (Telegram.WebApp.setBackgroundColor) Telegram.WebApp.setBackgroundColor('#ffffff');
    } catch(e){}
  }
}
function telegramShare(text, url){
  const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  if (window.Telegram && Telegram.WebApp){
    try {
      if (Telegram.WebApp.openTelegramLink){ Telegram.WebApp.openTelegramLink(shareUrl); return; }
      if (Telegram.WebApp.switchInlineQuery){ Telegram.WebApp.switchInlineQuery(text + ' ' + url, ['users','groups','channels']); return; }
    } catch(e){}
  }
  // 浏览器环境：优雅失败，给出提示并尽力打开系统分享
  toast('需在 Telegram 内打开才能分享');
  try { window.open(shareUrl, '_blank'); } catch(e){}
}
function deepLink(){
  const bot = (state.botUser || CONFIG.BOT_USERNAME || 'your_bot');
  const code = encodeURIComponent(state.referralCode || 'invite');
  return 'https://t.me/' + bot + '?startapp=' + code;
}

/* ---------- 滚动引擎 ---------- */
let rafId = null, lastTs = null, offset = 0, playing = false;

let _mcanvas = null, _mctx = null;
function measureCharWidth(fs){
  if (!_mcanvas){ _mcanvas = document.createElement('canvas'); _mctx = _mcanvas.getContext('2d'); }
  const fam = getComputedStyle(scrollText).fontFamily;
  _mctx.font = fs + 'px ' + fam;
  const s = '中测abc字DEFghij';
  const w = _mctx.measureText(s).width;
  return w / s.length;
}
function pxPerSec(){
  if (state.speedUnit === 'px') return state.speedPx;
  const cw = measureCharWidth(state.fontSize);
  return (state.speedCpm / 60) * cw;
}
function applyPrompterStyle(){
  scrollText.style.fontSize = state.fontSize + 'px';
  scrollText.style.color = state.color;
  scrollText.style.textAlign = state.align;
  const scale = state.mirror ? -1 : 1;
  scrollText.style.transform = 'translateY(' + (-offset) + 'px) scaleX(' + scale + ')';
}
function loop(ts){
  if (lastTs == null) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (playing){
    const max = Math.max(0, scrollText.offsetHeight - viewport.clientHeight);
    offset += pxPerSec() * dt;
    if (offset >= max){ offset = max; playing = false; updatePlayBtn(); }
    const scale = state.mirror ? -1 : 1;
    scrollText.style.transform = 'translateY(' + (-offset) + 'px) scaleX(' + scale + ')';
  }
  rafId = requestAnimationFrame(loop);
}
function updatePlayBtn(){ btnPlay.textContent = playing ? '⏸' : '▶'; }
function togglePlay(){ playing = !playing; if (playing) lastTs = null; updatePlayBtn(); }
function resetScroll(){ offset = 0; playing = false; updatePlayBtn(); applyPrompterStyle(); }

/* ---------- 速度 UI 同步 ---------- */
function renderSpeedUI(){
  const isPx = state.speedUnit === 'px';
  const min = isPx ? 20 : 60;
  const max = isPx ? 400 : 600;
  const val = isPx ? state.speedPx : state.speedCpm;
  speedBar.min = min; speedBar.max = max; speedBar.value = val;
  setSpeed.min = min; setSpeed.max = max; setSpeed.value = val;
  const unitLabel = isPx ? '像素/秒' : '字/分';
  speedBarLabel.textContent = val + unitLabel;
  setSpeedLabel.textContent = val + unitLabel;
}
function setSpeedVal(v){
  if (state.speedUnit === 'px') state.speedPx = v; else state.speedCpm = v;
  renderSpeedUI();
  saveState();
}

/* ---------- 结果卡（Canvas） ---------- */
function wrapText(ctx, text, maxWidth){
  const lines = [];
  let line = '';
  for (const ch of text){
    if (ch === '\n'){ lines.push(line); line = ''; continue; }
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}
function generateCard(){
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 1350;
  const ctx = c.getContext('2d');
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, 1350);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#eef2fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1350);
  // 标题
  ctx.fillStyle = '#2f6fed'; ctx.font = 'bold 64px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('提词器 · Teleprompter', 80, 120);
  ctx.fillStyle = '#79808c'; ctx.font = '32px sans-serif';
  ctx.fillText('流畅提词 · 解放双眼', 80, 175);
  // 分隔线
  ctx.strokeStyle = '#e3e6ec'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(80, 210); ctx.lineTo(1000, 210); ctx.stroke();
  // 讲稿片段
  const raw = (state.script || '在这里粘贴你的讲稿……').replace(/\s+$/,'');
  const snippet = raw.slice(0, 240);
  ctx.fillStyle = '#1f2430'; ctx.font = '40px sans-serif'; ctx.textAlign = 'left';
  const lines = wrapText(ctx, snippet, 920);
  const maxLines = 14;
  let y = 295;
  for (let i = 0; i < Math.min(lines.length, maxLines); i++){ ctx.fillText(lines[i], 80, y); y += 62; }
  if (lines.length > maxLines){ ctx.fillStyle = '#79808c'; ctx.fillText('……（更多内容见 App）', 80, y); }
  // 水印 + 深链
  ctx.fillStyle = '#2f6fed'; ctx.font = 'bold 34px sans-serif';
  ctx.fillText('由「提词器」生成', 80, 1230);
  ctx.fillStyle = '#79808c'; ctx.font = '30px sans-serif';
  const dl = deepLink();
  const dlines = wrapText(ctx, dl, 920);
  let ly = 1280;
  for (const l of dlines.slice(0, 2)){ ctx.fillText(l, 80, ly); ly += 42; }
  cardDataUrl = c.toDataURL('image/png');
  cardPreview.src = cardDataUrl;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

/* ---------- initData 服务端验签（可选） ---------- */
let verifyStatus = '';
function renderVerifyStatus(){
  const el = document.getElementById('verifyStatus');
  const el2 = document.getElementById('verifyStatus2');
  const txt = verifyStatus || '';
  if (el) el.textContent = txt;
  if (el2) el2.textContent = txt;
}
async function verifyInitData(){
  if (!CONFIG.VERIFY_URL) return;
  if (!(window.Telegram && Telegram.WebApp)) return;
  const initData = Telegram.WebApp.initData;
  if (!initData) return;
  try {
    const r = await fetch(CONFIG.VERIFY_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ initData: initData })
    });
    const j = await r.json();
    verifyStatus = j.valid ? '身份已验证 ✓' : ('验签未通过: ' + (j.reason || ''));
  } catch(e){
    verifyStatus = '验签请求失败';
  }
  renderVerifyStatus();
}

/* ---------- 事件绑定 ---------- */
btnPlay.addEventListener('click', togglePlay);
btnReset.addEventListener('click', resetScroll);
btnSettings.addEventListener('click', function(){ settingsSheet.classList.remove('hidden'); });
btnCloseSettings.addEventListener('click', function(){ settingsSheet.classList.add('hidden'); });
btnCard.addEventListener('click', function(){ generateCard(); cardOverlay.classList.remove('hidden'); });
btnCloseCard.addEventListener('click', function(){ cardOverlay.classList.add('hidden'); });

speedBar.addEventListener('input', function(e){ setSpeedVal(+e.target.value); });
setSpeed.addEventListener('input', function(e){ setSpeedVal(+e.target.value); });
btnSpeedUnit.addEventListener('click', function(){
  state.speedUnit = state.speedUnit === 'px' ? 'cpm' : 'px';
  renderSpeedUI(); saveState();
});

setScript.addEventListener('input', function(e){
  state.script = e.target.value;
  scrollText.textContent = state.script;
  offset = 0; applyPrompterStyle();
  debounceSave();
});
setFontSize.addEventListener('input', function(e){
  state.fontSize = +e.target.value;
  setFontSizeLabel.textContent = state.fontSize + 'px';
  applyPrompterStyle(); saveState();
});
setColor.addEventListener('input', function(e){ state.color = e.target.value; applyPrompterStyle(); saveState(); });
setAlign.addEventListener('change', function(e){ state.align = e.target.value; applyPrompterStyle(); saveState(); });
setMirror.addEventListener('change', function(e){ state.mirror = e.target.checked; applyPrompterStyle(); saveState(); });
setReferral.addEventListener('input', function(e){ state.referralCode = e.target.value.trim(); saveState(); });
setBotUser.addEventListener('input', function(e){ state.botUser = e.target.value.trim(); saveState(); });

btnDownloadCard.addEventListener('click', function(){
  if (!cardDataUrl) return;
  const a = document.createElement('a');
  a.href = cardDataUrl; a.download = 'teleprompter-card.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
btnShareCard.addEventListener('click', function(){
  const url = deepLink();
  const text = '我用「提词器」顺滑录完了稿子 🎬 你也来试试：';
  telegramShare(text, url);
});

/* ---------- 初始化 ---------- */
function init(){
  loadState();
  initTelegram();

  // 还原 DOM
  setScript.value = state.script;
  scrollText.textContent = state.script;
  setFontSize.value = state.fontSize;
  setFontSizeLabel.textContent = state.fontSize + 'px';
  setColor.value = state.color;
  setAlign.value = state.align;
  setMirror.checked = !!state.mirror;
  setReferral.value = state.referralCode || '';
  setBotUser.value = state.botUser || '';

  applyPrompterStyle();
  renderSpeedUI();
  updatePlayBtn();

  rafId = requestAnimationFrame(loop);
  verifyInitData();
}
init();
</script>
</body>
</html>
